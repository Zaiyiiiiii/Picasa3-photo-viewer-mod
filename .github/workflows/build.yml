# Builds version.dll on every push and pull request; a pushed v* tag also publishes a GitHub release
# with the packed zip.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The vcpkg commit the dependencies are tested with.
  VCPKG_COMMIT: 469a0504e4a6ebf6173d1c0f51a7fa34c382fd43

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      # Only the pinned commit is fetched, not vcpkg's whole history.
      - name: Get vcpkg
        shell: pwsh
        run: |
          git init --quiet ..\vcpkg
          git -C ..\vcpkg fetch --quiet --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_COMMIT
          git -C ..\vcpkg checkout --quiet FETCH_HEAD
          ..\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          # actions/cache needs an absolute path without '..'.
          $cache = "$env:RUNNER_TEMP\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV

      # Built packages are cached; a change of vcpkg, the manifest or the overlays rebuilds them.
      # Saved right after the dependencies, so a later failure does not lose them.
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x86-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('mod/vcpkg.json', 'tools/vcpkg-overlays/**', 'tools/vcpkg-triplets/**') }}
          restore-keys: vcpkg-x86-static-${{ env.VCPKG_COMMIT }}-

      - name: Dependencies
        shell: cmd
        run: tools\deps.cmd

      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build and pack
        shell: cmd
        run: |
          if "%GITHUB_REF_TYPE%"=="tag" (tools\release.cmd %GITHUB_REF_NAME%) else (tools\release.cmd dev-%GITHUB_SHA:~0,7%)

      - uses: actions/upload-artifact@v7
        with:
          name: picasa-viewer-mod
          path: release\*.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "release\picasa-viewer-mod-$env:GITHUB_REF_NAME.zip"
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:GITHUB_REF_NAME $zip --clobber }
          else { gh release create $env:GITHUB_REF_NAME $zip --title $env:GITHUB_REF_NAME --generate-notes }
